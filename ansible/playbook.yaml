---
- name: Prepare isolated PostgreSQL worker and attached data volume
  ansible.builtin.import_playbook: playbooks/00-prepare-db-worker.yaml

- name: Install Kubernetes prerequisites and kubeadm
  ansible.builtin.import_playbook: playbooks/01-install-kubeadm.yaml

- name: Initialize the Kubernetes control plane
  ansible.builtin.import_playbook: playbooks/02-initialize-control-plane.yaml

- name: Join the workers
  ansible.builtin.import_playbook: playbooks/03-join-workers.yaml

- name: Verify the cluster
  ansible.builtin.import_playbook: playbooks/04-verify-cluster.yaml

