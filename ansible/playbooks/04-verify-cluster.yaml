---
- name: Verify the cluster
  hosts: control_plane
  become: true
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes
      until: >-
        nodes.stdout_lines | length == groups['k8s'] | length and
        (nodes.stdout_lines | select('search', ' Ready ') | list | length) == groups['k8s'] | length
      retries: 40
      delay: 15
      changed_when: false

    - name: Label the workers
      ansible.builtin.command: kubectl label node {{ item }} node-role.kubernetes.io/worker= --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ groups['workers'] }}"
      changed_when: false

    - name: Mark the isolated database worker for PostgreSQL scheduling
      ansible.builtin.command: kubectl label node db-worker marketly.io/role=database --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    # The Helm chart in ecom-deploy uses these labels to decide where pods run.
    - name: Label the public and backend nodes
      ansible.builtin.command: kubectl label node {{ item.node }} marketly.io/role={{ item.role }} --overwrite
      loop:
        - { node: public-worker, role: public }
        - { node: worker-1, role: backend }
        - { node: worker-2, role: backend }
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Keep other pods off the database node
      ansible.builtin.command: kubectl taint node db-worker marketly.io/role=database:NoSchedule --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: kubectl get nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes_wide
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes_wide.stdout_lines
