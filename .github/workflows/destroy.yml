name: Destroy Terraform

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Delete the infrastructure. Leave unchecked to preview.
        type: boolean
        default: false
      confirm:
        description: Type destroy-dev when execute is checked.
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecom-infra-dev
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: infra-dev
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_key_name: ${{ vars.EC2_KEY_NAME }}
      TF_VAR_db_ami_id: ${{ vars.DB_AMI_ID }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
      TF_VAR_team_ssh_allowed_cidrs: ${{ secrets.TEAM_SSH_ALLOWED_CIDRS || '[]' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check destroy confirmation and configuration
        env:
          EXECUTE_DESTROY: ${{ inputs.execute }}
          DESTROY_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [[ "$EXECUTE_DESTROY" == 'true' && "$DESTROY_CONFIRMATION" != 'destroy-dev' ]]; then
            echo '::error::Type destroy-dev to confirm deletion of the dev infrastructure and database disk.'
            exit 1
          fi

          for setting in AWS_ROLE_ARN AWS_ACCOUNT_ID TF_VAR_key_name TF_VAR_db_ami_id TF_VAR_ssh_allowed_cidr; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing setting for infra-dev: $setting"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.0'
          terraform_wrapper: false

      - name: Plan infrastructure deletion
        run: |
          terraform init -input=false -lockfile=readonly

          plan_file="$RUNNER_TEMP/destroy.tfplan"
          plan_log="$RUNNER_TEMP/destroy-plan.jsonl"
          if ! terraform plan -destroy -input=false -lock-timeout=5m -json -out="$plan_file" > "$plan_log"; then
            jq -r 'select(.type == "diagnostic" and .diagnostic.severity == "error") | .diagnostic.summary' "$plan_log"
            exit 1
          fi

          {
            echo "### Terraform destroy plan"
            echo "Commit: $GITHUB_SHA"
            terraform show -json "$plan_file" | jq -r '
              [.resource_changes[]? | select(.mode == "managed" and (.type | startswith("aws_"))) | select(.change.actions | index("delete"))] |
              "AWS resources to delete: \(length)"
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply saved destroy plan
        if: inputs.execute
        run: |
          destroy_log="$RUNNER_TEMP/terraform-destroy.jsonl"
          if ! terraform apply -input=false -lock-timeout=5m -json "$RUNNER_TEMP/destroy.tfplan" > "$destroy_log"; then
            jq -r 'select(.type == "diagnostic" and .diagnostic.severity == "error") | .diagnostic.summary' "$destroy_log"
            exit 1
          fi

          echo "Terraform finished deleting the dev infrastructure." >> "$GITHUB_STEP_SUMMARY"
