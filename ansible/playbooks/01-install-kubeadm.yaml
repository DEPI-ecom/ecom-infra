---
- name: Install kubeadm on all nodes
  hosts: k8s:!db_workers
  become: true
  vars:
    kubernetes_version: "1.35"
  tasks:
    - name: Wait for SSH through the bastion
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Set the hostname to the inventory name (becomes the node name)
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Keep cloud-init from resetting the hostname
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
        content: "preserve_hostname: true\n"
        mode: "0644"

    - name: Make the hostname resolve locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Turn swap off
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load kernel modules now
      ansible.builtin.command: modprobe {{ item }}
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: "0644"
      register: sysctl

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl.changed

    - name: Install containerd and prerequisites
      ansible.builtin.dnf:
        name: [containerd, iptables-nft, iproute-tc, conntrack-tools, socat]
        state: present

    - name: Add the Kubernetes repo
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/"
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/repodata/repomd.xml.key"
        exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.dnf:
        name: [kubelet, kubeadm, kubectl]
        state: present
        disable_excludes: kubernetes

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_default
      changed_when: false
      check_mode: false

    - name: Use the systemd cgroup driver
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
        mode: "0644"
      register: containerd_conf

    - name: Enable and (re)start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: "{{ 'restarted' if containerd_conf.changed else 'started' }}"

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
