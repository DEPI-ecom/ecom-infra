---
- name: Deploy monitoring through Argo CD
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Copy monitoring Argo CD Application manifest to the control plane
      ansible.builtin.copy:
        src: ../monitoring/monitoring-app.yaml
        dest: /tmp/monitoring-app.yaml
        mode: "0644"

    - name: Apply monitoring Argo CD Application
      ansible.builtin.command: kubectl apply -f /tmp/monitoring-app.yaml
      register: monitoring_apply
      changed_when: "'created' in monitoring_apply.stdout or 'configured' in monitoring_apply.stdout"

    - name: Show monitoring Application status
      ansible.builtin.command: kubectl get application monitoring -n argocd
      register: monitoring_status
      changed_when: false
      failed_when: false

    - name: Print monitoring status
      ansible.builtin.debug:
        var: monitoring_status.stdout_lines
